apiVersion: apps/v1
kind: Deployment
metadata:
  name: lldap
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: lldap
          image: lldap
          envFrom:
            - secretRef:
                name: lldap-secret
          ports:
            - containerPort: 3890
              name: ldap
              hostPort: 3890
            - containerPort: 17170
              name: ui
              hostPort: 17170
          volumeMounts:
            - name: lldap-data
              mountPath: /data
            - name: lldap-config
              mountPath: /data/lldap_config.toml
              subPath: lldap_config.toml
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
        - name: bootstrap
          image: lldap
          command: ["/bin/bash", "-c", "/app/bootstrap.sh && sleep infinity"]
          env:
            - name: LLDAP_URL
              value: "http://localhost:17170"
            - name: LLDAP_ADMIN_USERNAME
              value: "admin"
            - name: LLDAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lldap-secret
                  key: LLDAP_LDAP_USER_PASS
          volumeMounts:
            - name: lldap-schemas
              mountPath: /bootstrap/user-schemas
      volumes:
        - name: lldap-schemas
          configMap:
            name: lldap-schemas
        - name: lldap-config
          configMap:
            name: lldap-config
        - name: lldap-data
          persistentVolumeClaim:
            claimName: lldap-data
