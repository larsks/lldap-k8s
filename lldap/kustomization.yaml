apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      component: lldap
resources:
  - deployment.yaml
  - pvc.yaml

secretGenerator:
  - name: lldap-secret
    options:
      disableNameSuffixHash: true
    envs:
      - secrets.env

configMapGenerator:
  - name: lldap-config
    files:
      - files/lldap_config.toml
  - name: lldap-schemas
    files:
      - files/userschema.json

images:
  - name: lldap
    newName: docker.io/lldap/lldap
    newTag: 2026-07-19-debian-rootless
